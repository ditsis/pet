<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>diary</title>
  <link id="page-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='24' x='5' font-size='22' fill='%23b5a4ad'%3E%E2%99%A1%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&family=Silkscreen:wght@400&family=Sniglet:wght@400&display=swap" rel="stylesheet" />
  <style id="dynamic-theme-styles">
    :root {
      --bg-color: #fbf6f8;
      --box-bg: #ffffff;
      --box-border: #eee5ea;
      --box-glow: rgba(175, 152, 165, 0.08);
      --text-primary: #6c6167;
      --text-secondary: #a598a0;
      --accent-pink: #e4c6d4;
      --accent-pink-dark: #b98ea3;
      --accent-pill-bg: #f8f2f5;
      --accent-pill-text: #a598a0;
      --font-main: 'Quicksand', sans-serif;
      --font-pixel: 'Silkscreen', monospace;
      --font-cute: 'Sniglet', cursive;
      --diary-width: 490px;
      --diary-height: 280px;
      --drifter-size: 38px;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: var(--font-main);
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      transition: background-color 0.3s ease, color 0.25s ease;
    }

    #custom-bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.4;
      display: none;
    }

    #custom-bg-video-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      display: none;
    }

    #custom-bg-video,
    #custom-bg-yt-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 112vw;
      height: 112vh;
      min-width: 177.78vh;
      min-height: 56.25vw;
      transform: translate(-50%, -50%);
      object-fit: cover;
      border: 0;
      pointer-events: none;
      opacity: 0.44;
      filter: blur(5px);
    }

    .drifter-track {
      position: fixed;
      left: 0;
      right: 0;
      height: 56px;
      pointer-events: none;
      z-index: 6;
      overflow: hidden;
    }

    .drifter-track-top {
      top: 10px;
    }

    .drifter-track-bottom {
      bottom: 14px;
    }

    .drifter-sprite {
      position: absolute;
      width: var(--drifter-size);
      height: var(--drifter-size);
      object-fit: contain;
      pointer-events: none;
    }

    @keyframes driftLeftToRight {
      0% { transform: translateX(-80px); }
      100% { transform: translateX(calc(100vw + 80px)); }
    }

    @keyframes driftRightToLeft {
      0% { transform: translateX(calc(100vw + 80px)); }
      100% { transform: translateX(-80px); }
    }

    .diary-card {
      background: var(--box-bg);
      border: 1px solid var(--box-border);
      border-radius: 30px;
      box-shadow: 0 8px 28px var(--box-glow);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      position: relative;
    }

    @keyframes dateFloatBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2px); }
    }

    .floating-date-pill {
      animation: dateFloatBob 4.5s ease-in-out infinite;
    }

    .note-text-stage {
      transition: opacity 0.55s ease, filter 0.55s ease;
    }

    .note-blur-out {
      opacity: 0;
      filter: blur(5px);
    }

    @keyframes floatingPillBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    .floating-music-pill {
      background: var(--box-bg);
      border: 1px solid var(--box-border);
      border-radius: 12px;
      box-shadow: 0 4px 16px var(--box-glow);
      animation: floatingPillBob 4.2s ease-in-out infinite;
      transition: border-color 0.2s ease;
    }

    .floating-music-pill:hover {
      border-color: var(--accent-pink-dark);
    }

    @keyframes eqBarBounce {
      0%, 100% { height: 3px; }
      50% { height: 10px; }
    }

    .eq-bar {
      width: 2px;
      height: 4px;
      border-radius: 2px;
      background-color: var(--accent-pink-dark);
      transition: height 0.2s ease;
    }

    .eq-playing .eq-bar:nth-child(1) { animation: eqBarBounce 0.75s ease-in-out infinite; }
    .eq-playing .eq-bar:nth-child(2) { animation: eqBarBounce 0.6s ease-in-out 0.15s infinite; }
    .eq-playing .eq-bar:nth-child(3) { animation: eqBarBounce 0.85s ease-in-out 0.3s infinite; }

    .draggable-widget {
      touch-action: none;
    }

    .drag-handle {
      cursor: grab;
      opacity: 0.28;
      transition: opacity 0.2s ease;
    }

    .drag-handle:hover {
      opacity: 0.75;
    }

    .modal-backdrop {
      background: rgba(250, 244, 247, 0.75);
      backdrop-filter: blur(4px);
    }

    .modal-card {
      background: #ffffff;
      border: 1px solid #ece3e8;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(130, 110, 120, 0.1);
    }

    .soft-input {
      width: 100%;
      background: #fcf9fa;
      border: 1px solid #e9dfe4;
      border-radius: 10px;
      padding: 8px 12px;
      font-family: var(--font-main);
      font-size: 12.5px;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s ease;
    }

    .soft-input:focus {
      border-color: var(--accent-pink-dark);
    }

    .soft-btn {
      background: #f5ebf0;
      color: var(--text-primary);
      border: 1px solid #e6d6df;
      border-radius: 10px;
      padding: 7px 14px;
      font-family: var(--font-main);
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .soft-btn:hover {
      background: #eee0e7;
      border-color: #d8c2ce;
    }

    .soft-btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid #ede4e9;
      border-radius: 10px;
      padding: 6px 12px;
      font-family: var(--font-main);
      font-weight: 500;
      font-size: 12px;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .soft-btn-ghost:hover {
      background: #faf5f8;
      color: var(--text-primary);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div id="custom-bg-layer"></div>
  <div id="custom-bg-video-wrap">
    <video id="custom-bg-video" autoplay muted loop playsinline style="display:none;"></video>
    <iframe id="custom-bg-yt-frame" allow="autoplay; encrypted-media" style="display:none;"></iframe>
  </div>

  <div id="top-drifter-track" class="drifter-track drifter-track-top"></div>
  <div id="bottom-drifter-track" class="drifter-track drifter-track-bottom"></div>

  <audio id="bg-music-player" loop preload="auto"></audio>

  <main id="main-stage" class="relative z-10 w-full flex flex-col items-center justify-center">

    <section id="widget-diary" class="draggable-widget flex flex-col items-center justify-center">
      <div id="diary-box-card" class="diary-card px-8 py-6 flex flex-col justify-between text-center" style="width: min(90vw, var(--diary-width)); min-height: var(--diary-height);">
        <span class="drag-handle absolute top-4 right-5 px-1 text-[11px]" data-drag-target="widget-diary" title="move">⋮⋮</span>

        <div class="flex items-center justify-center pt-1">
          <span id="diary-note-date" class="floating-date-pill inline-block px-3 py-0.5 rounded-full text-[11px] tracking-wide" style="background: var(--accent-pill-bg); color: var(--accent-pill-text);">nov 28</span>
        </div>

        <div id="diary-note-stage" class="note-text-stage my-auto py-3 flex flex-col items-center justify-center">
          <p id="diary-note-text" class="text-[13.5px] sm:text-[14.5px] leading-relaxed font-normal px-2 whitespace-pre-line" style="color: var(--text-primary);"></p>

          <div class="flex items-center justify-center gap-3 mt-2.5" style="color: var(--text-secondary);">
            <button type="button" onclick="prevDiaryNote()" class="px-2 py-0.5 rounded hover:opacity-70 text-xs transition" title="previous">‹</button>
            <button type="button" onclick="nextDiaryNote()" class="px-2 py-0.5 rounded hover:opacity-70 text-xs transition" title="next">›</button>
          </div>
        </div>

        <div class="flex flex-col items-center gap-2 pt-1">
          <p id="diary-footer-whisper" class="text-[11.5px]" style="color: var(--text-secondary);"></p>

          <div id="owner-inline-note-bar" class="hidden flex items-center justify-center gap-2 pt-1">
            <button type="button" onclick="openNoteManagerModal()" class="soft-btn-ghost text-[11px] py-1 px-2.5">+ notes</button>
          </div>
        </div>
      </div>

      <div id="floating-music-bar" onclick="toggleBgMusic(event)" class="floating-music-pill mt-4 px-3.5 py-1.5 flex items-center gap-2.5 cursor-pointer" title="play / pause">
        <span id="floating-play-icon" class="text-[10px]" style="color: var(--text-secondary);">▶</span>
        <div class="h-3 w-[1px]" style="background: var(--box-border);"></div>
        <span id="floating-song-title" class="text-[11.5px] tracking-wide max-w-[200px] truncate" style="color: var(--text-secondary);">girl favorite</span>
        <div id="floating-eq" class="flex items-end gap-[2px] h-2.5 ml-0.5">
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
        </div>
      </div>
    </section>

  </main>

  <div class="fixed bottom-3 left-3 z-40 flex items-center gap-2">
    <button id="owner-lock-btn" type="button" onclick="handleLockClick()" class="p-2 text-sm transition opacity-65 hover:opacity-100 focus:outline-none" style="background: transparent; border: none; color: var(--text-secondary);" title="lock">
      <span id="owner-lock-icon">♡</span>
    </button>

    <div id="owner-toolbar" class="hidden flex flex-wrap items-center gap-1 px-2.5 py-1 rounded-xl" style="background: rgba(255,255,255,0.95); border: 1px solid #ece3e8;">
      <button type="button" onclick="openEditModal('sizes')" class="px-2 py-1 rounded-lg text-[11.5px] hover:bg-stone-50" style="color: var(--text-primary);">sizes</button>
      <button type="button" onclick="openEditModal('colors')" class="px-2 py-1 rounded-lg text-[11.5px] hover:bg-stone-50" style="color: var(--text-primary);">colors</button>
      <button type="button" onclick="openEditModal('images')" class="px-2 py-1 rounded-lg text-[11.5px] hover:bg-stone-50" style="color: var(--text-primary);">images</button>
      <button type="button" onclick="openEditModal('song')" class="px-2 py-1 rounded-lg text-[11.5px] hover:bg-stone-50" style="color: var(--text-primary);">song</button>
      <button type="button" onclick="openEditModal('text')" class="px-2 py-1 rounded-lg text-[11.5px] hover:bg-stone-50" style="color: var(--text-primary);">text</button>
      <button type="button" onclick="openEditModal('security')" class="px-2 py-1 rounded-lg text-[11.5px] hover:bg-stone-50" style="color: var(--accent-pink-dark);">account</button>
      <button type="button" onclick="copyBakedCode()" class="px-2 py-1 rounded-lg text-[11.5px] hover:bg-stone-50" style="color: var(--text-secondary);">export</button>
      <button type="button" onclick="resetLayoutPositions()" class="px-2 py-1 rounded-lg text-[11.5px] hover:bg-stone-50" style="color: var(--text-secondary);">center</button>
    </div>
  </div>

  <div id="toast-banner" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 px-3.5 py-1 rounded-lg text-[11.5px] pointer-events-none opacity-0 transition-opacity duration-200" style="background: #ffffff; border: 1px solid #ece3e8; color: var(--text-primary);"></div>

  <div id="lock-modal" class="modal-backdrop fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div class="modal-card w-full max-w-xs p-5 text-center">
      <div class="flex justify-end">
        <button type="button" onclick="closeModal('lock-modal')" class="text-xs px-1.5" style="color: var(--text-secondary);">✕</button>
      </div>
      <p class="text-sm font-medium mb-1" style="color: var(--text-primary);">sign in</p>
      <p id="lock-modal-desc" class="text-[11.5px] mb-4" style="color: var(--text-secondary);">owner access</p>

      <div id="passcode-auth-box" class="space-y-2.5">
        <input id="owner-passcode-input" type="password" placeholder="passcode" class="soft-input text-center" onkeydown="if(event.key==='Enter') submitOwnerPasscode()" />
        <button type="button" onclick="submitOwnerPasscode()" class="soft-btn w-full">unlock</button>
      </div>

      <div id="firebase-auth-box" class="space-y-2 mt-2">
        <p id="fb-auth-subtitle" class="text-[11px]" style="color: var(--text-secondary);"></p>
        <input id="fb-email-input" type="email" placeholder="email" class="soft-input" />
        <input id="fb-pass-input" type="password" placeholder="password" class="soft-input" />
        <button type="button" onclick="signInWithFirebaseEmail()" class="soft-btn w-full">sign in</button>
        <button type="button" onclick="signInWithFirebaseGoogle()" class="soft-btn-ghost w-full">google</button>
      </div>
    </div>
  </div>

  <div id="notes-manager-modal" class="modal-backdrop fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div class="modal-card w-full max-w-md p-5 max-h-[85vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-3">
        <p class="text-sm font-medium" style="color: var(--text-primary);">notes</p>
        <button type="button" onclick="closeModal('notes-manager-modal')" class="text-xs px-1.5" style="color: var(--text-secondary);">✕</button>
      </div>

      <div class="space-y-2 mb-4 p-3 rounded-xl" style="background: #fcf9fa; border: 1px solid #f0e7ec;">
        <textarea id="new-note-text" rows="3" placeholder="write something..." class="soft-input"></textarea>
        <div class="flex items-center gap-2">
          <input id="new-note-date" type="text" placeholder="date" class="soft-input" />
          <button type="button" onclick="addDiaryNote()" class="soft-btn shrink-0">add</button>
        </div>
      </div>

      <div id="notes-editor-list" class="space-y-2"></div>
    </div>
  </div>

  <div id="customize-modal" class="modal-backdrop fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div class="modal-card w-full max-w-lg p-5 max-h-[86vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-3">
        <p id="customize-modal-title" class="text-sm font-medium" style="color: var(--text-primary);">settings</p>
        <button type="button" onclick="closeModal('customize-modal')" class="text-xs px-1.5" style="color: var(--text-secondary);">✕</button>
      </div>

      <div class="flex flex-wrap gap-1 mb-4 pb-2.5 border-b" style="border-color: #f0e7ec;">
        <button type="button" onclick="switchEditTab('sizes')" class="soft-btn-ghost text-[11.5px]">sizes</button>
        <button type="button" onclick="switchEditTab('colors')" class="soft-btn-ghost text-[11.5px]">colors</button>
        <button type="button" onclick="switchEditTab('images')" class="soft-btn-ghost text-[11.5px]">images</button>
        <button type="button" onclick="switchEditTab('song')" class="soft-btn-ghost text-[11.5px]">song</button>
        <button type="button" onclick="switchEditTab('text')" class="soft-btn-ghost text-[11.5px]">text</button>
        <button type="button" onclick="switchEditTab('security')" class="soft-btn-ghost text-[11.5px]">account</button>
      </div>

      <div id="tab-sizes" class="edit-tab-pane space-y-3 hidden">
        <div>
          <label class="text-[11.5px] block mb-1">width (<span id="val-diary-w">490</span>px)</label>
          <input id="size-diary-w" type="range" min="300" max="660" value="490" class="w-full" oninput="updateSizeSetting('diaryWidth', this.value)" />
        </div>
        <div>
          <label class="text-[11.5px] block mb-1">height (<span id="val-diary-h">280</span>px)</label>
          <input id="size-diary-h" type="range" min="210" max="480" value="280" class="w-full" oninput="updateSizeSetting('diaryHeight', this.value)" />
        </div>
      </div>
      </div>

      <div id="tab-colors" class="edit-tab-pane grid grid-cols-2 gap-3 hidden">
        <div>
          <label class="text-[11.5px] block mb-1">background</label>
          <input id="color-bg" type="color" class="w-full h-8 rounded-lg cursor-pointer" onchange="updateColorSetting('bgColor', this.value)" />
        </div>
        <div>
          <label class="text-[11.5px] block mb-1">box</label>
          <input id="color-box-bg" type="color" class="w-full h-8 rounded-lg cursor-pointer" onchange="updateColorSetting('boxBg', this.value)" />
        </div>
        <div>
          <label class="text-[11.5px] block mb-1">primary text</label>
          <input id="color-text-primary" type="color" class="w-full h-8 rounded-lg cursor-pointer" onchange="updateColorSetting('textPrimary', this.value)" />
        </div>
        <div>
          <label class="text-[11.5px] block mb-1">secondary text</label>
          <input id="color-text-secondary" type="color" class="w-full h-8 rounded-lg cursor-pointer" onchange="updateColorSetting('textSecondary', this.value)" />
        </div>
        <div>
          <label class="text-[11.5px] block mb-1">accent</label>
          <input id="color-accent-pink-dark" type="color" class="w-full h-8 rounded-lg cursor-pointer" onchange="updateColorSetting('accentPinkDark', this.value)" />
        </div>
      </div>

      <div id="tab-images" class="edit-tab-pane space-y-3 hidden">
        <div class="p-3 rounded-xl space-y-2" style="background: #fcf9fa; border: 1px solid #f0e7ec;">
          <p class="text-[11.5px] font-medium">tab favicon</p>
          <input id="input-favicon-url" type="text" placeholder="favicon url" class="soft-input" onchange="updateImageSetting('faviconUrl', this.value)" />
          <input type="file" accept="image/*" class="text-[11px]" onchange="handleImageUpload(event, 'faviconUrl')" />
        </div>

        <div class="p-3 rounded-xl space-y-2" style="background: #fcf9fa; border: 1px solid #f0e7ec;">
          <p class="text-[11.5px] font-medium">floating png/gif</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div>
              <label class="text-[11px] block mb-1">top</label>
              <input id="input-top-drifter-url" type="text" placeholder="url" class="soft-input" onchange="updateImageSetting('topDrifterUrl', this.value)" />
              <input type="file" accept="image/*" class="text-[11px] mt-1" onchange="handleImageUpload(event, 'topDrifterUrl')" />
            </div>
            <div>
              <label class="text-[11px] block mb-1">bottom</label>
              <input id="input-bottom-drifter-url" type="text" placeholder="url" class="soft-input" onchange="updateImageSetting('bottomDrifterUrl', this.value)" />
              <input type="file" accept="image/*" class="text-[11px] mt-1" onchange="handleImageUpload(event, 'bottomDrifterUrl')" />
            </div>
          </div>
        </div>

        <div class="p-3 rounded-xl space-y-2" style="background: #fcf9fa; border: 1px solid #f0e7ec;">
          <p class="text-[11.5px] font-medium">background image</p>
          <input id="input-bg-img-url" type="text" placeholder="image url" class="soft-input" onchange="updateImageSetting('bgImageUrl', this.value)" />
          <input type="file" accept="image/*" class="text-[11px]" onchange="handleImageUpload(event, 'bgImageUrl')" />
        </div>

        <div class="p-3 rounded-xl space-y-2" style="background: #fcf9fa; border: 1px solid #f0e7ec;">
          <p class="text-[11.5px] font-medium">background video / youtube</p>
          <input id="input-bg-video-url" type="text" placeholder="youtube or mp4 url" class="soft-input" onchange="updateVideoBgSetting()" />
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="text-[11px] block">start (s)</label>
              <input id="input-bg-video-start" type="number" min="0" value="0" class="soft-input text-xs" onchange="updateVideoBgSetting()" />
            </div>
            <div>
              <label class="text-[11px] block">end (s)</label>
              <input id="input-bg-video-end" type="number" min="0" value="0" class="soft-input text-xs" onchange="updateVideoBgSetting()" />
            </div>
            <div>
              <label class="text-[11px] block">blur (px)</label>
              <input id="input-bg-video-blur" type="number" min="0" max="24" value="5" class="soft-input text-xs" onchange="updateVideoBgSetting()" />
            </div>
          </div>
        </div>
      </div>

      <div id="tab-song" class="edit-tab-pane space-y-3 hidden">
        <div>
          <label class="text-[11.5px] block mb-1">track label</label>
          <input id="input-song-title" type="text" placeholder="song name" class="soft-input" onchange="updateTextSetting('songTitle', this.value)" />
        </div>
        <div>
          <label class="text-[11.5px] block mb-1">audio url (.mp3 / .wav)</label>
          <input id="input-song-url" type="text" placeholder="direct audio url" class="soft-input" onchange="updateSongSetting(this.value)" />
        </div>
        <input type="file" accept="audio/*" class="text-[11px]" onchange="handleAudioUpload(event)" />
      </div>

      <div id="tab-text" class="edit-tab-pane space-y-3 hidden">
        <div>
          <label class="text-[11.5px] block mb-1">bottom quote</label>
          <input id="input-diary-whisper" type="text" class="soft-input" onchange="updateTextSetting('diaryWhisper', this.value)" />
        </div>
      </div>

      <div id="tab-security" class="edit-tab-pane space-y-3 hidden">
        <div class="p-3 rounded-xl space-y-2" style="background: #fcf9fa; border: 1px solid #f0e7ec;">
          <p class="text-[11.5px] font-medium">passcode</p>
          <input id="input-new-passcode" type="password" placeholder="new passcode" class="soft-input" />

          <p class="text-[11.5px] font-medium">firebase config</p>

          <div class="flex items-center gap-2">
            <button type="button" onclick="saveFirebaseConfig()" class="soft-btn text-[11.5px]">connect</button>
            <span id="firebase-status-badge" class="text-[11px]" style="color: var(--text-secondary);">offline</span>
          </div>

  <script id="baked-state-data" type="application/json">{}</script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const DEFAULT_FIREBASE_CONFIG = {
      apiKey: "AIzaSyDL26DDvtw9oA-7LB6awvEeqAZwrmORhQE",
      authDomain: "meowmeow-6ec62.firebaseapp.com",
      projectId: "meowmeow-6ec62",
      storageBucket: "meowmeow-6ec62.firebasestorage.app",
      messagingSenderId: "972387391744",
      appId: "1:972387391744:web:351994f02fe9d89c2efbe5",
      measurementId: "G-V4E7LLW94X"
    };

    const DEFAULT_STATE = {
      passcodeHash: "",
      firebaseConfig: DEFAULT_FIREBASE_CONFIG,
      ownerUid: "",
      diaryTitle: "diary",
      diaryWhisper: "taking things slowly",
      songTitle: "girl favorite",
      notes: [
        { id: "n1", text: "quiet mornings & warm tea.", date: "nov 28" },
        { id: "n2", text: "remember to breathe.", date: "nov 27" }
      ],
      sizes: {
        diaryWidth: 490,
        diaryHeight: 280,
        drifterSize: 38
      },
      colors: {
        bgColor: "#fbf6f8",
        boxBg: "#ffffff",
        boxBorder: "#eee5ea",
        textPrimary: "#6c6167",
        textSecondary: "#a598a0",
        accentPinkDark: "#b98ea3"
      },
      images: {
        faviconUrl: "",
        topDrifterUrl: "",
        bottomDrifterUrl: "",
        bgImageUrl: "",
        bgVideoUrl: "",
        bgVideoStart: 0,
        bgVideoEnd: 0,
        bgVideoBlur: 5
      },
      songUrl: "",
      positions: {
        "widget-diary": { x: 0, y: 0 }
      }
    };

    let state = structuredClone(DEFAULT_STATE);
    let isOwnerUnlocked = false;
    let currentNoteIndex = 0;
    let noteCycleTimer = null;
    let ytLoopTimer = null;
    let fbApp = null;
    let fbAuth = null;
    let fbDb = null;
    let fbUnsubState = null;

    const LOCAL_BACKUP_KEY = "gentle_diary_backup_v1";

    function loadInitialState() {
      try {
        const bakedEl = document.getElementById("baked-state-data");
        if (bakedEl && bakedEl.textContent.trim().length > 2) {
          const parsedBaked = JSON.parse(bakedEl.textContent);
          state = mergeDeep(structuredClone(DEFAULT_STATE), parsedBaked);
        }
      } catch (e) {}
      try {
        const saved = localStorage.getItem(LOCAL_BACKUP_KEY);
        if (saved) {
          const parsedSaved = JSON.parse(saved);
          state = mergeDeep(state, parsedSaved);
        }
      } catch (e) {}
      if (!state.firebaseConfig || !state.firebaseConfig.apiKey) {
        state.firebaseConfig = DEFAULT_FIREBASE_CONFIG;
      }
    }

    function mergeDeep(target, source) {
      if (!source || typeof source !== "object") return target;
      for (const key of Object.keys(source)) {
        if (source[key] && typeof source[key] === "object" && !Array.isArray(source[key])) {
          if (!target[key] || typeof target[key] !== "object") target[key] = {};
          mergeDeep(target[key], source[key]);
        } else if (source[key] !== undefined) {
          target[key] = source[key];
        }
      }
      return target;
    }

    async function hashString(str) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    function showToast(msg) {
      const el = document.getElementById("toast-banner");
      el.textContent = msg;
      el.style.opacity = "1";
      clearTimeout(el._t);
      el._t = setTimeout(() => { el.style.opacity = "0"; }, 2200);
    }

    async function persistState() {
      try {
        localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify(state));
      } catch (e) {}

      if (fbDb && isOwnerUnlocked) {
        try {
          if (!fbAuth.currentUser) {
            await signInAnonymously(fbAuth);
          }
          const cleanState = structuredClone(state);
          await setDoc(doc(fbDb, "diary_sanctuary", "main_state"), cleanState, { merge: true });
        } catch (err) {
          console.error("Firestore save error:", err);
          showToast("cloud save blocked");
        }
      }
    }

    function applyThemeAndSizes() {
      const root = document.documentElement;
      root.style.setProperty("--bg-color", state.colors.bgColor);
      root.style.setProperty("--box-bg", state.colors.boxBg);
      root.style.setProperty("--box-border", state.colors.boxBorder);
      root.style.setProperty("--text-primary", state.colors.textPrimary);
      root.style.setProperty("--text-secondary", state.colors.textSecondary);
      root.style.setProperty("--accent-pink-dark", state.colors.accentPinkDark);

      root.style.setProperty("--diary-width", state.sizes.diaryWidth + "px");
      root.style.setProperty("--diary-height", state.sizes.diaryHeight + "px");

      const favEl = document.getElementById("page-favicon");
      if (favEl) {
        if (state.images.faviconUrl) {
          favEl.removeAttribute("type");
          favEl.href = state.images.faviconUrl;
        } else {
          favEl.type = "image/svg+xml";
          favEl.href = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='24' x='5' font-size='22' fill='%23b5a4ad'%3E%E2%99%A1%3C/text%3E%3C/svg%3E";
        }
      }
      document.getElementById("diary-footer-whisper").textContent = state.diaryWhisper;
      document.getElementById("floating-song-title").textContent = state.songTitle || "girl favorite";

      applyPositions();
      renderDrifters();
      renderBackgroundMedia();
    }

    function applyPositions() {
      const el = document.getElementById("widget-diary");
      const pos = state.positions?.["widget-diary"] || { x: 0, y: 0 };
      if (el) {
        el.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
      }
    }

    function renderDrifters() {
      const topTrack = document.getElementById("top-drifter-track");
      const botTrack = document.getElementById("bottom-drifter-track");
      topTrack.innerHTML = "";
      botTrack.innerHTML = "";

      if (state.images.topDrifterUrl) {
        const img = document.createElement("img");
        img.src = state.images.topDrifterUrl;
        img.className = "drifter-sprite";
        img.style.animation = "driftLeftToRight 22s linear infinite";
        topTrack.appendChild(img);
      }

      if (state.images.bottomDrifterUrl) {
        const img = document.createElement("img");
        img.src = state.images.bottomDrifterUrl;
        img.className = "drifter-sprite";
        img.style.animation = "driftRightToLeft 25s linear infinite";
        botTrack.appendChild(img);
      }
    }

    function extractYoutubeId(url) {
      if (!url) return null;
      const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
      return m ? m[1] : null;
    }

    function renderBackgroundMedia() {
      const imgLayer = document.getElementById("custom-bg-layer");
      const vidWrap = document.getElementById("custom-bg-video-wrap");
      const vidEl = document.getElementById("custom-bg-video");
      const ytEl = document.getElementById("custom-bg-yt-frame");

      if (state.images.bgImageUrl) {
        imgLayer.style.backgroundImage = `url('${state.images.bgImageUrl}')`;
        imgLayer.style.display = "block";
      } else {
        imgLayer.style.display = "none";
      }

      clearInterval(ytLoopTimer);
      const vUrl = (state.images.bgVideoUrl || "").trim();
      const blurPx = Number(state.images.bgVideoBlur ?? 5);
      const startSec = Math.max(0, Number(state.images.bgVideoStart || 0));
      const endSec = Math.max(0, Number(state.images.bgVideoEnd || 0));

      if (!vUrl) {
        vidWrap.style.display = "none";
        vidEl.style.display = "none";
        ytEl.style.display = "none";
        ytEl.src = "";
        return;
      }

      vidWrap.style.display = "block";
      const ytId = extractYoutubeId(vUrl);

      if (ytId) {
        vidEl.style.display = "none";
        vidEl.pause();
        ytEl.style.display = "block";
        ytEl.style.filter = `blur(${blurPx}px)`;
        const endParam = endSec > startSec ? `&end=${endSec}` : "";
        const srcUrl = `https://www.youtube.com/embed/${ytId}?autoplay=1&mute=1&controls=0&loop=1&playlist=${ytId}&start=${startSec}${endParam}&modestbranding=1&rel=0&playsinline=1`;
        if (ytEl.src !== srcUrl) {
          ytEl.src = srcUrl;
        }
        if (endSec > startSec) {
          const spanMs = (endSec - startSec) * 1000;
          ytLoopTimer = setInterval(() => {
            ytEl.src = srcUrl;
          }, spanMs);
        }
      } else {
        ytEl.style.display = "none";
        ytEl.src = "";
        vidEl.style.display = "block";
        vidEl.style.filter = `blur(${blurPx}px)`;
        if (vidEl.src !== vUrl) {
          vidEl.src = vUrl;
        }
        vidEl.currentTime = startSec;
        vidEl.play().catch(() => {});
        vidEl.ontimeupdate = () => {
          if (endSec > startSec && vidEl.currentTime >= endSec) {
            vidEl.currentTime = startSec;
          }
        };
      }
    }

    function renderDiaryNote(animate = true) {
      const stage = document.getElementById("diary-note-stage");
      const textEl = document.getElementById("diary-note-text");
      const dateEl = document.getElementById("diary-note-date");
      const notes = state.notes && state.notes.length ? state.notes : [{ text: "...", date: "nov 28" }];
      if (currentNoteIndex >= notes.length) currentNoteIndex = 0;
      const note = notes[currentNoteIndex];

      if (animate) {
        stage.classList.add("note-blur-out");
        setTimeout(() => {
          textEl.textContent = note.text;
          dateEl.textContent = note.date || "♡";
          stage.classList.remove("note-blur-out");
        }, 380);
      } else {
        textEl.textContent = note.text;
        dateEl.textContent = note.date || "♡";
      }
    }

    function startNoteAutoCycle() {
      clearInterval(noteCycleTimer);
      noteCycleTimer = setInterval(() => {
        if ((state.notes || []).length > 1) {
          currentNoteIndex = (currentNoteIndex + 1) % state.notes.length;
          renderDiaryNote(true);
        }
      }, 6500);
    }

    window.nextDiaryNote = function () {
      if (!(state.notes || []).length) return;
      currentNoteIndex = (currentNoteIndex + 1) % state.notes.length;
      renderDiaryNote(true);
      startNoteAutoCycle();
    };

    window.prevDiaryNote = function () {
      if (!(state.notes || []).length) return;
      currentNoteIndex = (currentNoteIndex - 1 + state.notes.length) % state.notes.length;
      renderDiaryNote(true);
      startNoteAutoCycle();
    };

    let musicUnlockedByClick = false;
    let muffledAudioCtx = null;
    let muffledFilterNode = null;

    function ensureMuffledAudioChain(audioEl) {
      if (muffledAudioCtx) {
        if (muffledAudioCtx.state === "suspended") {
          muffledAudioCtx.resume().catch(() => {});
        }
        return;
      }
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        muffledAudioCtx = new AudioCtx();
        const source = muffledAudioCtx.createMediaElementSource(audioEl);
        muffledFilterNode = muffledAudioCtx.createBiquadFilter();
        muffledFilterNode.type = "lowpass";
        muffledFilterNode.frequency.value = 540;
        muffledFilterNode.Q.value = 0.8;
        const gainNode = muffledAudioCtx.createGain();
        gainNode.gain.value = 0.65;
        source.connect(muffledFilterNode);
        muffledFilterNode.connect(gainNode);
        gainNode.connect(muffledAudioCtx.destination);
      } catch (e) {}
    }

    function updateMusicIndicators(playing) {
      const playIcon = document.getElementById("floating-play-icon");
      const eq = document.getElementById("floating-eq");
      if (playIcon) playIcon.textContent = playing ? "❚❚" : "▶";
      if (eq) {
        if (playing) eq.classList.add("eq-playing");
        else eq.classList.remove("eq-playing");
      }
    }

    function startMuffledPlayback() {
      const audio = document.getElementById("bg-music-player");
      if (!state.songUrl) return;
      if (audio.src !== state.songUrl) {
        audio.src = state.songUrl;
      }
      audio.volume = 0.55;
      ensureMuffledAudioChain(audio);
      audio.play().then(() => {
        musicUnlockedByClick = true;
        updateMusicIndicators(true);
      }).catch(() => {});
    }

    window.toggleBgMusic = function (e) {
      if (e) e.stopPropagation();
      const audio = document.getElementById("bg-music-player");
      if (!state.songUrl) {
        showToast("no audio set");
        return;
      }
      if (audio.paused) {
        startMuffledPlayback();
      } else {
        musicUnlockedByClick = true;
        audio.pause();
        updateMusicIndicators(false);
      }
    };

    document.addEventListener("pointerdown", () => {
      if (!musicUnlockedByClick && state.songUrl) {
        startMuffledPlayback();
      }
    });

    window.openModal = function (id) {
      const el = document.getElementById(id);
      if (el) {
        el.classList.remove("hidden");
        el.classList.add("flex");
      }
    };

    window.closeModal = function (id) {
      const el = document.getElementById(id);
      if (el) {
        el.classList.add("hidden");
        el.classList.remove("flex");
      }
    };

    window.handleLockClick = function () {
      if (isOwnerUnlocked) {
        isOwnerUnlocked = false;
        updateOwnerUI();
        showToast("locked");
        return;
      }
      const desc = document.getElementById("lock-modal-desc");
      const passBox = document.getElementById("passcode-auth-box");
      const fbSub = document.getElementById("fb-auth-subtitle");

      if (state.firebaseConfig && state.firebaseConfig.apiKey) {
        passBox.classList.add("hidden");
        desc.textContent = state.ownerUid ? "owner sign in" : "claim ownership";
        if (fbSub) fbSub.textContent = "";
      } else {
        passBox.classList.remove("hidden");
        desc.textContent = state.passcodeHash ? "enter passcode" : "set passcode";
      }
      document.getElementById("owner-passcode-input").value = "";
      openModal("lock-modal");
    };

    window.submitOwnerPasscode = async function () {
      const val = document.getElementById("owner-passcode-input").value;
      if (!val || val.length < 2) {
        showToast("enter passcode");
        return;
      }
      const hashed = await hashString(val);
      if (!state.passcodeHash) {
        state.passcodeHash = hashed;
        isOwnerUnlocked = true;
        await persistState();
        updateOwnerUI();
        closeModal("lock-modal");
        showToast("unlocked");
      } else if (hashed === state.passcodeHash) {
        isOwnerUnlocked = true;
        updateOwnerUI();
        closeModal("lock-modal");
        showToast("unlocked");
      } else {
        showToast("wrong passcode");
      }
    };

    function updateOwnerUI() {
      const toolbar = document.getElementById("owner-toolbar");
      const noteBar = document.getElementById("owner-inline-note-bar");
      const lockIcon = document.getElementById("owner-lock-icon");
      if (isOwnerUnlocked) {
        toolbar.classList.remove("hidden");
        noteBar.classList.remove("hidden");
        lockIcon.textContent = "♥";
      } else {
        toolbar.classList.add("hidden");
        noteBar.classList.add("hidden");
        lockIcon.textContent = "♡";
      }
    }

    window.openNoteManagerModal = function () {
      renderNotesEditorList();
      openModal("notes-manager-modal");
    };

    function renderNotesEditorList() {
      const list = document.getElementById("notes-editor-list");
      list.innerHTML = "";
      (state.notes || []).forEach((n, idx) => {
        const row = document.createElement("div");
        row.className = "p-2.5 rounded-xl flex items-start justify-between gap-2 text-xs";
        row.style.background = "#fcf9fa";
        row.style.border = "1px solid #f0e7ec";
        row.innerHTML = `
          <div>
            <p class="whitespace-pre-line">${escapeHtml(n.text)}</p>
            <span class="text-[11px]" style="color:var(--text-secondary);">${escapeHtml(n.date || "")}</span>
          </div>
          <button type="button" onclick="deleteDiaryNote(${idx})" class="px-1.5 py-0.5 rounded hover:opacity-70" style="color:var(--text-secondary);">✕</button>
        `;
        list.appendChild(row);
      });
    }

    window.addDiaryNote = async function () {
      const text = document.getElementById("new-note-text").value.trim();
      const date = document.getElementById("new-note-date").value.trim() || "today";
      if (!text) return;
      state.notes.unshift({ id: crypto.randomUUID(), text, date });
      currentNoteIndex = 0;
      document.getElementById("new-note-text").value = "";
      document.getElementById("new-note-date").value = "";
      renderNotesEditorList();
      renderDiaryNote(false);
      await persistState();
      showToast("added");
    };

    window.deleteDiaryNote = async function (idx) {
      state.notes.splice(idx, 1);
      if (!state.notes.length) {
        state.notes.push({ id: crypto.randomUUID(), text: "...", date: "♡" });
      }
      currentNoteIndex = 0;
      renderNotesEditorList();
      renderDiaryNote(false);
      await persistState();
    };

    window.openEditModal = function (tab) {
      populateEditInputs();
      switchEditTab(tab || "sizes");
      openModal("customize-modal");
    };

    window.switchEditTab = function (tab) {
      document.querySelectorAll(".edit-tab-pane").forEach(p => p.classList.add("hidden"));
      const active = document.getElementById("tab-" + tab);
      if (active) active.classList.remove("hidden");
    };

    function populateEditInputs() {
      document.getElementById("size-diary-w").value = state.sizes.diaryWidth;
      document.getElementById("val-diary-w").textContent = state.sizes.diaryWidth;
      document.getElementById("size-diary-h").value = state.sizes.diaryHeight;
      document.getElementById("val-diary-h").textContent = state.sizes.diaryHeight;

      document.getElementById("color-bg").value = state.colors.bgColor;
      document.getElementById("color-box-bg").value = state.colors.boxBg;
      document.getElementById("color-text-primary").value = state.colors.textPrimary;
      document.getElementById("color-text-secondary").value = state.colors.textSecondary;
      document.getElementById("color-accent-pink-dark").value = state.colors.accentPinkDark;

      document.getElementById("input-favicon-url").value = state.images.faviconUrl || "";
      document.getElementById("input-top-drifter-url").value = state.images.topDrifterUrl || "";
      document.getElementById("input-bottom-drifter-url").value = state.images.bottomDrifterUrl || "";
      document.getElementById("input-bg-img-url").value = state.images.bgImageUrl || "";
      document.getElementById("input-bg-video-url").value = state.images.bgVideoUrl || "";
      document.getElementById("input-bg-video-start").value = state.images.bgVideoStart || 0;
      document.getElementById("input-bg-video-end").value = state.images.bgVideoEnd || 0;
      document.getElementById("input-bg-video-blur").value = state.images.bgVideoBlur ?? 5;

      document.getElementById("input-song-title").value = state.songTitle || "";
      document.getElementById("input-song-url").value = state.songUrl || "";
      document.getElementById("input-diary-whisper").value = state.diaryWhisper || "";

      if (state.firebaseConfig) {
        document.getElementById("input-firebase-config").value = JSON.stringify(state.firebaseConfig, null, 2);
      }
    }

    window.updateSizeSetting = async function (key, val) {
      state.sizes[key] = Number(val);
      const map = {
        diaryWidth: "val-diary-w",
        diaryHeight: "val-diary-h"
      };
      if (map[key]) document.getElementById(map[key]).textContent = val;
      applyThemeAndSizes();
      await persistState();
    };

    window.updateColorSetting = async function (key, val) {
      state.colors[key] = val;
      applyThemeAndSizes();
      await persistState();
    };

    window.updateTextSetting = async function (key, val) {
      state[key] = val;
      applyThemeAndSizes();
      await persistState();
    };

    window.updateImageSetting = async function (key, val) {
      state.images[key] = val.trim();
      applyThemeAndSizes();
      await persistState();
    };

    window.updateVideoBgSetting = async function () {
      state.images.bgVideoUrl = document.getElementById("input-bg-video-url").value.trim();
      state.images.bgVideoStart = Number(document.getElementById("input-bg-video-start").value || 0);
      state.images.bgVideoEnd = Number(document.getElementById("input-bg-video-end").value || 0);
      state.images.bgVideoBlur = Number(document.getElementById("input-bg-video-blur").value ?? 5);
      renderBackgroundMedia();
      await persistState();
    };

    window.handleImageUpload = function (e, key) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        state.images[key] = reader.result;
        applyThemeAndSizes();
        await persistState();
        showToast("updated");
      };
      reader.readAsDataURL(file);
    };

    window.updateSongSetting = async function (val) {
      state.songUrl = val.trim();
      musicUnlockedByClick = false;
      await persistState();
      showToast("updated");
    };

    window.handleAudioUpload = function (e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        state.songUrl = reader.result;
        musicUnlockedByClick = false;
        await persistState();
        showToast("loaded");
      };
      reader.readAsDataURL(file);
    };

    window.changeOwnerPasscode = async function () {
      const next = document.getElementById("input-new-passcode").value;
      if (!next || next.length < 2) {
        showToast("too short");
        return;
      }
      state.passcodeHash = await hashString(next);
      document.getElementById("input-new-passcode").value = "";
      await persistState();
      showToast("saved");
    };

    window.saveFirebaseConfig = async function () {
      const raw = document.getElementById("input-firebase-config").value.trim();
      if (!raw) return;
      try {
        const cleaned = raw
          .replace(/^[^{]*/, "")
          .replace(/[^}]*$/, "")
          .replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:/g, '$1"$2":')
          .replace(/'/g, '"');
        const cfg = JSON.parse(cleaned);
        state.firebaseConfig = cfg;
        await persistState();
        initFirebaseConnection(cfg);
        showToast("connected");
      } catch (e) {
        showToast("invalid config");
      }
    };

    function initFirebaseConnection(cfg) {
      try {
        fbApp = initializeApp(cfg);
        fbAuth = getAuth(fbApp);
        fbDb = getFirestore(fbApp);
        const statusEl = document.getElementById("firebase-status-badge");
        if (statusEl) statusEl.textContent = "connected";

        signInAnonymously(fbAuth).catch(() => {});

        onAuthStateChanged(fbAuth, async (user) => {
          if (user && !user.isAnonymous) {
            if (!state.ownerUid) {
              state.ownerUid = user.uid;
              isOwnerUnlocked = true;
              await persistState();
              updateOwnerUI();
              showToast("claimed");
            } else if (user.uid === state.ownerUid) {
              isOwnerUnlocked = true;
              updateOwnerUI();
            } else {
              isOwnerUnlocked = false;
              updateOwnerUI();
              await fbAuth.signOut();
              await signInAnonymously(fbAuth);
              showToast("not owner");
            }
          }
        });

        if (fbUnsubState) fbUnsubState();
        fbUnsubState = onSnapshot(doc(fbDb, "diary_sanctuary", "main_state"), (snap) => {
          if (snap.exists() && !isOwnerUnlocked) {
            const remote = snap.data();
            state = mergeDeep(state, remote);
            try {
              localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify(state));
            } catch (e) {}
            applyThemeAndSizes();
            renderDiaryNote(false);
          }
        }, () => {});
      } catch (e) {}
    }

    window.signInWithFirebaseEmail = async function () {
      if (!fbAuth) return;
      const email = document.getElementById("fb-email-input").value.trim();
      const pass = document.getElementById("fb-pass-input").value;
      try {
        const cred = await signInWithEmailAndPassword(fbAuth, email, pass);
        if (state.ownerUid && cred.user.uid !== state.ownerUid) {
          await fbAuth.signOut();
          await signInAnonymously(fbAuth);
          showToast("not owner");
          return;
        }
        if (!state.ownerUid) state.ownerUid = cred.user.uid;
        isOwnerUnlocked = true;
        await persistState();
        updateOwnerUI();
        closeModal("lock-modal");
        showToast("signed in");
      } catch (e) {
        showToast("sign in failed");
      }
    };

    window.signInWithFirebaseGoogle = async function () {
      if (!fbAuth) return;
      try {
        const cred = await signInWithPopup(fbAuth, new GoogleAuthProvider());
        if (state.ownerUid && cred.user.uid !== state.ownerUid) {
          await fbAuth.signOut();
          await signInAnonymously(fbAuth);
          showToast("not owner");
          return;
        }
        if (!state.ownerUid) state.ownerUid = cred.user.uid;
        isOwnerUnlocked = true;
        await persistState();
        updateOwnerUI();
        closeModal("lock-modal");
        showToast("signed in");
      } catch (e) {
        showToast("sign in failed");
      }
    };

    window.copyBakedCode = function () {
      const bakedState = structuredClone(state);
      const cloneDoc = document.documentElement.cloneNode(true);
      const toolbar = cloneDoc.querySelector("#owner-toolbar");
      const noteBar = cloneDoc.querySelector("#owner-inline-note-bar");
      const lockIcon = cloneDoc.querySelector("#owner-lock-icon");
      if (toolbar) toolbar.classList.add("hidden");
      if (noteBar) noteBar.classList.add("hidden");
      if (lockIcon) lockIcon.textContent = "♡";

      const bakedScript = cloneDoc.querySelector("#baked-state-data");
      if (bakedScript) {
        bakedScript.textContent = JSON.stringify(bakedState);
      }

      const fullHtml = "<!DOCTYPE html>\n" + cloneDoc.outerHTML;
      const ta = document.createElement("textarea");
      ta.value = fullHtml;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      showToast("copied html");
    };

    window.resetLayoutPositions = async function () {
      state.positions = {
        "widget-diary": { x: 0, y: 0 }
      };
      applyPositions();
      await persistState();
      showToast("centered");
    };

    function initDragging() {
      let activeId = null;
      let startX = 0;
      let startY = 0;
      let origX = 0;
      let origY = 0;

      document.querySelectorAll(".drag-handle").forEach(handle => {
        handle.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          activeId = handle.getAttribute("data-drag-target");
          const cur = state.positions?.[activeId] || { x: 0, y: 0 };
          startX = e.clientX;
          startY = e.clientY;
          origX = cur.x;
          origY = cur.y;
          handle.setPointerCapture(e.pointerId);
        });

        handle.addEventListener("pointermove", (e) => {
          if (!activeId) return;
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          if (!state.positions) state.positions = {};
          state.positions[activeId] = { x: origX + dx, y: origY + dy };
          applyPositions();
        });

        handle.addEventListener("pointerup", async () => {
          if (!activeId) return;
          activeId = null;
          await persistState();
        });
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadInitialState();
      applyThemeAndSizes();
      renderDiaryNote(false);
      startNoteAutoCycle();
      initDragging();
      if (state.firebaseConfig) {
        initFirebaseConnection(state.firebaseConfig);
      }
    });
  </script>
</body>
